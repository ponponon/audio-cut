name: Android signed release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      signing_certificate_sha256: ${{ steps.signatures.outputs.certificate_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Check release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          FULL_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d "'\"" | head -n 1)"
          APP_VERSION="${FULL_VERSION%%+*}"
          if [[ -z "$APP_VERSION" || "$FULL_VERSION" != *+* ]]; then
            echo "Could not read the app version from pubspec.yaml." >&2
            exit 1
          fi
          APP_VERSION_CODE="${FULL_VERSION##*+}"
          if [[ ! "$APP_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Could not read a numeric Android version code from pubspec.yaml." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            if [[ "$RELEASE_TAG" != "v$APP_VERSION" ]]; then
              echo "Release tag $RELEASE_TAG must match pubspec version v$APP_VERSION." >&2
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Release source must already be present in origin/main." >&2
              exit 1
            }
          fi
          echo "name=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$APP_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Restore signing files
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=audio_cut_upload\n'
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias audio_cut_upload >/dev/null

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build signed arm64 APK and App Bundle
        run: |
          flutter build apk --no-pub --release --target-platform android-arm64
          flutter build appbundle --no-pub --release

      - name: Verify signatures and arm64-only payload
        id: signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -f "$APK"
          test -f "$AAB"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          echo "APK signature verified."
          CERTIFICATE_SHA256="$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2)}')"
          test -n "$CERTIFICATE_SHA256"
          echo "certificate_sha256=$CERTIFICATE_SHA256" >> "$GITHUB_OUTPUT"
          jarsigner -verify "$AAB" >/dev/null
          echo "App Bundle signature verified."
          APK_CONTENTS="$(unzip -Z1 "$APK")"
          AAB_CONTENTS="$(unzip -Z1 "$AAB")"
          if ! grep -q '^lib/arm64-v8a/' <<< "$APK_CONTENTS"; then
            echo "APK does not contain arm64-v8a native libraries." >&2
            grep '^lib/' <<< "$APK_CONTENTS" | head -n 20 >&2 || true
            exit 1
          fi
          if ! grep -q '^base/lib/arm64-v8a/' <<< "$AAB_CONTENTS"; then
            echo "App Bundle does not contain arm64-v8a native libraries." >&2
            grep '^base/lib/' <<< "$AAB_CONTENTS" | head -n 20 >&2 || true
            exit 1
          fi
          echo "APK and App Bundle contain arm64-v8a native libraries."
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' <<< "$APK_CONTENTS"; then
            echo "APK contains a non-arm64 native library." >&2
            grep -E '^lib/(armeabi-v7a|x86|x86_64)/' <<< "$APK_CONTENTS" | head -n 20 >&2 || true
            exit 1
          fi
          if grep -Eq '^base/lib/(armeabi-v7a|x86|x86_64)/' <<< "$AAB_CONTENTS"; then
            echo "App Bundle contains a non-arm64 native library." >&2
            grep -E '^base/lib/(armeabi-v7a|x86|x86_64)/' <<< "$AAB_CONTENTS" | head -n 20 >&2 || true
            exit 1
          fi
          echo "Only arm64-v8a native libraries are packaged."

      - name: Prepare release files
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/audio-cut-${APP_VERSION}-arm64-v8a.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release-assets/audio-cut-${APP_VERSION}.aab"
          (cd release-assets && sha256sum ./*)

      - name: Remove signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-cut-android-${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audio-cut-android-${{ needs.build.outputs.version_name }}
          path: release-assets

      - name: Attach APK and App Bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  publish_r2:
    if: github.event_name == 'release'
    needs: [build, publish]
    runs-on: ubuntu-24.04
    environment: r2-release
    permissions:
      contents: read
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audio-cut-android-${{ needs.build.outputs.version_name }}
          path: release-assets

      - name: Publish versioned and latest APKs and manifests to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_VERSION_NAME: ${{ needs.build.outputs.version_name }}
          APP_VERSION_CODE: ${{ needs.build.outputs.version_code }}
          SIGNING_CERTIFICATE_SHA256: ${{ needs.build.outputs.signing_certificate_sha256 }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID in the r2-release environment}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY in the r2-release environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID in the r2-release environment}"
          : "${APP_VERSION_NAME:?Missing release version name}"
          : "${APP_VERSION_CODE:?Missing release version code}"
          : "${SIGNING_CERTIFICATE_SHA256:?Missing signing certificate fingerprint}"

          APK="release-assets/audio-cut-${APP_VERSION_NAME}-arm64-v8a.apk"
          test -f "$APK"
          APK_SIZE_BYTES="$(stat -c '%s' "$APK")"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          R2_BUCKET='audio-cut-releases'
          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          VERSIONED_KEY="releases/${APP_VERSION_NAME}/android/arm64-v8a/audio-cut-${APP_VERSION_NAME}-arm64-v8a.apk"
          LATEST_KEY='releases/latest/android/arm64-v8a/audio-cut-latest-arm64-v8a.apk'
          VERSIONED_URL="https://audio-cut-releases.quniv.cn/${VERSIONED_KEY}"

          mkdir -p release-manifests
          jq \
            --arg versionName "$APP_VERSION_NAME" \
            --argjson versionCode "$APP_VERSION_CODE" \
            --arg file "$VERSIONED_URL" \
            --argjson sizeBytes "$APK_SIZE_BYTES" \
            --arg sha256 "$APK_SHA256" \
            --arg signingCertificateSha256 "$SIGNING_CERTIFICATE_SHA256" \
            --arg updated "$(date -u +%F)" \
            '.versionName = $versionName
             | .versionCode = $versionCode
             | .file = $file
             | .sizeBytes = $sizeBytes
             | .sha256 = $sha256
             | .signingCertificateSha256 = $signingCertificateSha256
             | .updated = $updated' \
            website/releases/latest.json > release-manifests/latest.json
          cp release-manifests/latest.json \
            "release-manifests/${APP_VERSION_NAME}.json"

          aws s3 cp "$APK" "s3://${R2_BUCKET}/${VERSIONED_KEY}" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/vnd.android.package-archive' \
            --content-disposition "attachment; filename=\"audio-cut-${APP_VERSION_NAME}-arm64-v8a.apk\"" \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp "release-manifests/${APP_VERSION_NAME}.json" \
            "s3://${R2_BUCKET}/manifest/${APP_VERSION_NAME}.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'public, max-age=31536000, immutable'

          aws s3 cp "$APK" "s3://${R2_BUCKET}/${LATEST_KEY}" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/vnd.android.package-archive' \
            --content-disposition "attachment; filename=\"audio-cut-${APP_VERSION_NAME}-arm64-v8a.apk\"" \
            --cache-control 'public, max-age=60'
          aws s3 cp release-manifests/latest.json \
            "s3://${R2_BUCKET}/manifest/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'public, max-age=60'

          VERSIONED_SIZE="$(aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$VERSIONED_KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            --query ContentLength \
            --output text)"
          LATEST_SIZE="$(aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$LATEST_KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            --query ContentLength \
            --output text)"
          test "$VERSIONED_SIZE" = "$APK_SIZE_BYTES"
          test "$LATEST_SIZE" = "$APK_SIZE_BYTES"
