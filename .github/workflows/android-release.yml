name: Android signed release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Check release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          FULL_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d "'\"" | head -n 1)"
          APP_VERSION="${FULL_VERSION%%+*}"
          if [[ -z "$APP_VERSION" ]]; then
            echo "Could not read the app version from pubspec.yaml." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            if [[ "$RELEASE_TAG" != "v$APP_VERSION" ]]; then
              echo "Release tag $RELEASE_TAG must match pubspec version v$APP_VERSION." >&2
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Release source must already be present in origin/main." >&2
              exit 1
            }
          fi
          echo "name=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore signing files
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=audio_cut_upload\n'
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias audio_cut_upload >/dev/null

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build signed arm64 APK and App Bundle
        run: |
          flutter build apk --no-pub --release --target-platform android-arm64
          flutter build appbundle --no-pub --release

      - name: Verify signatures and arm64-only payload
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -f "$APK"
          test -f "$AAB"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          jarsigner -verify "$AAB" >/dev/null
          APK_CONTENTS="$(unzip -Z1 "$APK")"
          AAB_CONTENTS="$(unzip -Z1 "$AAB")"
          grep -q '^lib/arm64-v8a/' <<< "$APK_CONTENTS"
          grep -q '^base/lib/arm64-v8a/' <<< "$AAB_CONTENTS"
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' <<< "$APK_CONTENTS"; then
            echo "APK contains a non-arm64 native library." >&2
            exit 1
          fi
          if grep -Eq '^base/lib/(armeabi-v7a|x86|x86_64)/' <<< "$AAB_CONTENTS"; then
            echo "App Bundle contains a non-arm64 native library." >&2
            exit 1
          fi

      - name: Prepare release files
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/audio-cut-${APP_VERSION}-arm64-v8a.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release-assets/audio-cut-${APP_VERSION}.aab"
          (cd release-assets && sha256sum ./*)

      - name: Remove signing files
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio-cut-android-${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audio-cut-android-${{ needs.build.outputs.version_name }}
          path: release-assets

      - name: Attach APK and App Bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
