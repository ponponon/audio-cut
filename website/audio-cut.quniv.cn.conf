server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name audio-cut.quniv.cn;

    root /www/sites/audio-cut.quniv.cn/index;
    index index.html;
    access_log off;
    error_log /www/sites/audio-cut.quniv.cn/log/error.log;

    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|README\.md|AGENTS\.md) {
        return 404;
    }

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/quniv.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/quniv.cn/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 404 /404.html;
    error_page 497 https://$host$request_uri;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location = /download {
        add_header Cache-Control "no-store" always;
        return 302 https://audio-cut-releases.quniv.cn/releases/latest/android/arm64-v8a/audio-cut-latest-arm64-v8a.apk;
    }

    location = /releases/latest.json {
        add_header Cache-Control "no-store" always;
        return 302 https://audio-cut-releases.quniv.cn/manifest/latest.json;
    }

    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
